# ==================== Prometheus Configuration for Inference Monitoring ====================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'demo'
    environment: 'development'

# ==================== Alertmanager Configuration ====================
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
# ==================== Rule Files ====================
rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # ==================== Prometheus self-monitoring ====================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s

  # ==================== Redis Monitoring ====================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']  


  # ==================== Litellm Monitoring ====================
  - job_name: 'litellm'
    static_configs:
      - targets: ['litellm:4000']
    metrics_path: '/metrics'
